<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>paramilit</title>
    <style>
        :root {
            --color-pink: #ff1493;
            --color-violet: #8a2be2;
            --color-cyan: #00ffff;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020204;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            cursor: pointer;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .phrases-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85%;
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }

        .sweet-phrase {
            color: #ffffff;
            font-size: 2rem;
            font-weight: bold;
            font-family: 'Georgia', serif;
            text-shadow: 0 0 10px var(--color-pink), 0 0 25px rgba(255, 255, 255, 0.6);
            opacity: 0;
            transform: translate(0%, -50%) scale(0.5);
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: absolute;
            width: 100%;
            left: 0;
            top: 50%;
        }

        .sweet-phrase.active {
            opacity: 1;
            transform: translate(0%, -50%) scale(1);
        }

        .ui-text {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            z-index: 10;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .top-ui { top: 6%; }
        .bottom-ui { bottom: 6%; }
        .hidden { opacity: 0 !important; }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>
    
    <div class="ui-text top-ui" id="ui-top">Haz clic en la galaxia para acercarte</div>
    <div class="ui-text bottom-ui" id="ui-bottom">Me encanta coincidir contigo mi ojitos bonitos.✨</div>

    <div class="phrases-overlay" id="phrases-box"></div>

    <script>
        window.onload = function() {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');

            let width = canvas.width = window.innerWidth;
            let height = canvas.height = window.innerHeight;

            const totalEstrellas = 3500; 
            const estrellas = [];
            
            let zoomActual = 1.0;
            let zoomObjetivo = 1.0;
            let velocidadRotacionBase = 0.003;
            let velocidadRotacionActual = 0.003;

            const frasesCarino = [
                "Haces mis días muchísimo más bonitos... ✨",
                "Me gusta bastante platicar contigo",
                "Qué linda coincidencia haberte encontrado",
                "Sin duda alguna eh ganado todo contigo",
                "Me encantas tu y tus ojazos tan lindos",
                "Eres incre"
            ];
            
            let indiceFrase = 0;
            let ejecutandoZoom = false;

            window.addEventListener('resize', () => {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            });

            const box = document.getElementById('phrases-box');
            frasesCarino.forEach((texto, i) => {
                const div = document.createElement('div');
                div.className = 'sweet-phrase';
                div.innerText = texto;
                div.id = `phrase-${i}`;
                box.appendChild(div);
            });

            window.addEventListener('click', () => {
                ejecutandoZoom = !ejecutandoZoom;
                
                const uiTop = document.getElementById('ui-top');
                const uiBottom = document.getElementById('ui-bottom');

                if (ejecutandoZoom) {
                    zoomObjetivo = 3.8; 
                    velocidadRotacionBase = 0.012;
                    
                    uiTop.classList.add('hidden');
                    uiBottom.classList.add('hidden');

                    setTimeout(() => {
                        if(ejecutandoZoom) {
                            const elemento = document.getElementById(`phrase-${indiceFrase}`);
                            if(elemento) elemento.classList.add('active');
                        }
                    }, 400);

                } else {
                    zoomObjetivo = 1.0;
                    velocidadRotacionBase = 0.003;
                    
                    const elemento = document.getElementById(`phrase-${indiceFrase}`);
                    if(elemento) elemento.classList.remove('active');
                    
                    indiceFrase = (indiceFrase + 1) % frasesCarino.length;

                    setTimeout(() => {
                        if(!ejecutandoZoom) {
                            uiTop.classList.remove('hidden');
                            uiBottom.classList.remove('hidden');
                        }
                    }, 500);
                }
            });

            const coloresGalaxia = [
                'rgba(255, 20, 147, ',  // Deep Pink
                'rgba(138, 43, 226, ',  // Violeta espacial
                'rgba(0, 255, 255, ',   // Cian neón
                'rgba(255, 255, 255, ', // Estrellas blancas núcleos
                'rgba(255, 182, 193, '  // Rosa pastel
            ];

            class Estrella {
                constructor() {
                    this.reset();
                    // Distribución inicial a lo largo de la espiral paramétrica
                    this.t = Math.random() * Math.PI * 6; 
                }

                reset() {
                    // Matemáticas de espiral logarítmica (Brazos de Galaxia reales)
                    this.t = Math.random() * Math.PI * 5; // Distancia angular desde el centro
                    this.brazo = (Math.random() > 0.5 ? 0 : Math.PI); // Dos brazos principales opuestos
                    
                    // Compresión y dispersión para que parezcan nubes de polvo estelar reales
                    this.dispersionX = (Math.random() - 0.5) * 45 * (1 + this.t * 0.2);
                    this.dispersionY = (Math.random() - 0.5) * 45 * (1 + this.t * 0.2);
                    
                    this.size = Math.random() * 1.3 + 0.3;
                    this.color = coloresGalaxia[Math.floor(Math.random() * coloresGalaxia.length)];
                    this.alfa = Math.random() * 0.5 + 0.5;
                    
                    // El núcleo central acumula estrellas más brillantes y blancas
                    if(this.t < Math.PI) {
                        this.color = 'rgba(255, 255, 255, ';
                        this.size += 0.4;
                    }
                }

                actualizar() {
                    // La velocidad de rotación es mayor en el centro que en los bordes (Física orbital galáctica)
                    const factorVelocidad = velocidadRotacionActual * (1 / (1 + this.t * 0.1));
                    this.brazo += factorVelocidad;

                    // Ecuación paramétrica de la espiral
                    const radio = 14 * Math.exp(0.18 * this.t); 
                    
                    const xBase = Math.cos(this.t + this.brazo) * radio + this.dispersionX;
                    const yBase = Math.sin(this.t + this.brazo) * radio + this.dispersionY;

                    // Sistema de proyección y Zoom óptico centrado
                    this.x = width / 2 + xBase * zoomActual;
                    this.y = height / 2 + yBase * zoomActual;

                    // Si se alejan demasiado por el zoom, regresan de forma fluida
                    if (radio * zoomActual > Math.max(width, height) * 1.5) {
                        this.reset();
                    }
                }

                dibujar() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * (zoomActual * 0.2 + 0.8), 0, Math.PI * 2);
                    ctx.fillStyle = this.color + this.alfa + ')';
                    
                    if(this.size > 1.1) {
                        ctx.shadowBlur = this.size * 4;
                        ctx.shadowColor = this.color + '1)';
                    }
                    
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            }

            for (let i = 0; i < totalEstrellas; i++) {
                estrellas.push(new Estrella());
            }

            function animar() {
                // Reducimos la densidad de la estela para evitar que las estrellas se fusionen en anillos cerrados
                ctx.fillStyle = 'rgba(2, 2, 4, 0.09)';
                ctx.fillRect(0, 0, width, height);

                zoomActual += (zoomObjetivo - zoomActual) * 0.05;
                velocidadRotacionActual += (velocidadRotacionBase - velocidadRotacionActual) * 0.05;

                estrellas.forEach(e => {
                    e.actualizar();
                    e.dibujar();
                });

                requestAnimationFrame(animar);
            }

            animar();
        };
    </script>
</body>
</html>
